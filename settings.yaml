# Application & Operational Settings

scraper:
  sites:
    - "linkedin"
  hours_old: 24
  results_wanted: 20


email:
  smtp_server: "smtp.gmail.com"
  smtp_port: 587
  use_tls: true
  # Set email recipient or load from EMAIL_TO environment variable
  email_to: "rommy_rommy@yahoo.com"
  email_from: "roman.vel@gmail.com"

llm:
  provider: "gemini"     # Options: "gemini" (Google), "groq" (Free 14,400 req/day), "openrouter" (Free models), "ollama" (Local offline)
  model: "gemini-2.5-flash"
  enabled: true
  requests_per_minute: 15
  batch_size: 3
  max_retries: 3
  retry_delay: 12



reports:
  save_local_html: true
  local_filename: "jobs_report.html"

history:
  ignore_days: 7

