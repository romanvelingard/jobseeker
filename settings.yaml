# Application & Operational Settings

scraper:
  # Supported job boards: "linkedin", "glassdoor", "indeed", "zip_recruiter", "google", "bayt", "hellowork"
  sites:
    - "linkedin"
    - "glassdoor"
    - "indeed"
    - "zip_recruiter"
  hours_old: 24
  results_wanted: 10
  results_wanted_by_location:
    USA: 10
  delay_seconds: 2.0           # Seconds to wait between search queries to prevent 429 blocks
  profile_delay_seconds: 120   # Seconds to wait between executing different search profiles (2 minutes)
  fetch_description: false     # Set to false to prevent LinkedIn 429 detail page blocks
  auto_refresh_proxies: true   # Auto-fetch & verify fresh free proxies from ProxyScrape before each run
  max_auto_proxies: 5          # Number of verified live proxies to keep in rotation
  # Proxies: list of proxy URLs, or set via SCRAPER_PROXIES in .env
  # Format: "http://user:password@host:port" or "socks5://user:password@host:port"
  proxies:
    - "http://38.9.97.67:8080"
    - "http://45.194.3.132:8080"
    - "http://194.55.234.58:8080"
    - "http://34.43.46.91:443"
    - "http://209.38.24.108:3128"



email:
  smtp_server: "smtp.gmail.com"
  smtp_port: 587
  use_tls: true
  # Set email recipient(s) or load from EMAIL_TO environment variable (comma-separated or YAML list)
  email_to: "rommy_rommy@yahoo.com, stasia.ua@gmail.com"
  email_from: "roman.vel@gmail.com"

llm:
  provider: "gemini"     # Options: "gemini" (Google), "groq" (Free 14,400 req/day), "openrouter" (Free models), "ollama" (Local offline)
  model: "gemini-3.8-flash"
  enabled: true
  requests_per_minute: 15
  batch_size: 3
  max_retries: 3
  retry_delay: 12



reports:
  save_local_html: true
  local_filename: "jobs_report.html"

history:
  ignore_days: 7

