# Exclusion criteria.
# Keyword matching cannot classify employers or read nuance, so these
# criteria are documented here as MANUAL review checks, not as broad
# structured tokens that could misfire on leadership postings:
# - Junior / student / entry-level roles are out of scope (single words
#   like "junior" or "student" can also appear inside leadership JDs,
#   e.g. "mentor junior engineers" - judge by the actual role).
# - Sector exclusions: government bodies and large Israeli banks.
#   NOT excluded: fintech/payments companies and vendors whose clients
#   are banks or government (those remain in scope).
exclude:
  # Phrase-level exclusions (specific enough to avoid false hits)
  - "Unpaid internship"
  - "Internship"
  - "Entry level"
  - "Graduate program"
  - "Mechanical Engineer"
  - "Civil Engineer"
  - "Hardware Engineer"
  - "Talent Acquisition"
  - "Account Executive"
  - "Sales Manager"
  - "Scrum Master"

  # Language (postings must work in English or Hebrew)
