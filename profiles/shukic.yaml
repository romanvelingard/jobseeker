# Search Profile: Security & Platform Leadership (Director / VP / Head / CISO)
#
# NOTE: comments in this file document search criteria for the human reader.
# They are NOT enforced by the consuming program unless that program
# implements them. Only the structured keys below drive any actual filtering,
# and their exact behavior depends on the consuming program (unknown here).
#
# Search-only criteria (documented, not enforced by this file):
# - Salary floor: 60,000 ILS gross base per month. Postings with an
#   unpublished salary are flagged as "salary unknown" - not assumed to
#   meet or miss the bar.
# - Salary is a search filter only: NEVER state a salary in any application.
#   If an application form requires one, stop and ask the user.
# - Keywords below are search/match terms for finding relevant postings.
#   They are NOT claims about the user's skills or experience and must not
#   be read as a CV.
# - Locations list is a single flat list: "Remote" here does NOT enforce
#   legal eligibility to work from Israel, and does NOT separate Israel
#   results from abroad results. Both checks stay manual/outside this file.
# - Language: postings must work in English or Hebrew (user speaks both;
#   no German).
# - Company size: no size floor applies (the earlier minimum-size policy
#   was removed). Small growth-stage AI/quantum startups are in scope.
# - Seniority: senior leadership roles are the focus, but titles alone do
#   not disqualify a posting - scope is judged case by case, so there is
#   no blanket hands-on/IC exclusion.
# - Consulting/freelance roles are report-only: rates and submissions are
#   handled privately with the user's approval; this file sends nothing
#   automatically and contains no pricing.
# - Precision (manual review checks, deliberately NOT exclusion keywords,
#   because a JD that merely mentions these terms can still be a fit):
#   * Skip roles whose MANDATORY core is hands-on stack work outside the
#     user's profile (e.g. .NET/C# with React/Angular, RAG/MCP/LangChain
#     engineering) or whose core is QA/testing-team leadership.
#   * Skip roles whose core is formal project/program management or PMO
#     execution (mandatory years of project/program management, budgets,
#     procurement, tenders). Product management roles stay in scope as
#     conditional leads: a formal-PM-years gap is flagged, not excluded.
#   * Domain-specific products (e.g. hospitality, ERP/CRM) are judged by
#     the actual requirements, not by title.
#   * (Effect of these notes depends on the consuming program.)
#   * A mention of React, QA, testing or project management in a JD is not
#     a reason to drop a role; judge by what is mandatory.
# - Search terms such as "internal products" and "on-call" describe roles
#   to find. They are not claims about experience; nothing here is a CV.
