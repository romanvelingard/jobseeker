name: Run Daily LinkedIn Job Agent

on:
  schedule:
    - cron: '5 5 * * *'
  workflow_dispatch:

concurrency:
  group: daily-job-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Job Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agent.py

      - name: Persist seen jobs history
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Safely stash local seen_jobs update from agent.py
          git stash push -m "seen_jobs_update" seen_jobs.json || true
          
          # Sync with latest origin/main
          git fetch origin main
          git checkout -B main origin/main
          
          # Re-apply local seen_jobs.json
          git stash pop || true
          
          # Merge remote + local seen_jobs with 7-day retention pruning
          python -c "
          import json, subprocess, os
          from datetime import datetime, timezone, timedelta

          cutoff = datetime.now(timezone.utc) - timedelta(days=7)
          remote_data, local_data = {}, {}

          if os.path.exists('seen_jobs.json'):
              try:
                  with open('seen_jobs.json', 'r', encoding='utf-8') as f:
                      local_data = json.load(f)
              except Exception as e:
                  print(f'Local read warning: {e}')

          try:
              remote_raw = subprocess.check_output(['git', 'show', 'origin/main:seen_jobs.json'], encoding='utf-8')
              remote_data = json.loads(remote_raw)
          except Exception as e:
              print(f'Remote read warning: {e}')

          merged = {**remote_data, **local_data}
          pruned = {}
          for url, ts_str in merged.items():
              try:
                  if datetime.fromisoformat(ts_str) >= cutoff:
                      pruned[url] = ts_str
              except Exception:
                  pruned[url] = ts_str

          with open('seen_jobs.json', 'w', encoding='utf-8') as f:
              json.dump(pruned, f, indent=2, sort_keys=True)
          "

          git add seen_jobs.json
          git diff --staged --quiet || (git commit -m "chore: update seen_jobs history [skip ci]" && git push origin main)
