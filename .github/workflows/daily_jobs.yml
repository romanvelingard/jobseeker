name: Run Daily LinkedIn Job Agent

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Job Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agent.py

      - name: Persist seen jobs history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          python -c '
          import json, subprocess
          try:
              remote_content = subprocess.check_output(["git", "show", "origin/main:seen_jobs.json"], text=True)
              remote_data = json.loads(remote_content)
          except Exception:
              remote_data = {}
          try:
              with open("seen_jobs.json", "r", encoding="utf-8") as f:
                  local_data = json.load(f)
          except Exception:
              local_data = {}
          merged = {**remote_data, **local_data}
          with open("seen_jobs.json", "w", encoding="utf-8") as f:
              json.dump(merged, f, indent=2, sort_keys=True)
          '
          git reset --soft origin/main
          git add seen_jobs.json
          git diff --staged --quiet || (git commit -m "chore: update seen_jobs history [skip ci]" && git push origin main)


